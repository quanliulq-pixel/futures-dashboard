name: Refresh Futures Dashboard Pages

on:
  schedule:
    # 美股收盘后约北京时间 05:00；夜盘/开盘附近 22:30
    - cron: "0 21 * * 1-5"
    - cron: "30 14 * * 1-5"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "short_put_screen.py"
      - "export_static_pages.py"
      - "static/**"
      - "templates/**"
      - ".github/workflows/refresh_pages.yml"

permissions:
  contents: write

concurrency:
  group: refresh-futures-pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Rebuild static docs (quotes/analysis/NG/short-put)
        run: python export_static_pages.py
      - name: Commit & push docs snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "No docs changes"
            exit 0
          fi
          git commit -m "chore: refresh Pages snapshot $(date '+%Y-%m-%d %H:%M %Z')"
          git push
