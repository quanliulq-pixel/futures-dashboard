name: Weekly US Superstocks Scan

on:
  schedule:
    # After the US Friday close, in a useful Saturday morning window for Asia/Shanghai:
    # Saturday 08:00 Asia/Shanghai = 00:00 UTC Saturday.
    - cron: "0 0 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-us-superstocks
  # Never cancel a long Yahoo/SEC weekly run; a later dispatch should wait.
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TZ: Asia/Shanghai
      # Polite batching for a 5,000+ Yahoo weekly pull.
      SS_WEEKLY_CHUNK: "40"
      SS_WEEKLY_SLEEP: "2"
      SS_WEEKLY_RETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Week id for resume cache (US session date)
        id: week
        run: echo "id=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: data/us_superstocks/weekly.pkl
          key: ss-weekly-${{ steps.week.outputs.id }}-${{ github.run_id }}
          restore-keys: |
            ss-weekly-${{ steps.week.outputs.id }}-
      - name: Run weekly Superstocks scan
        run: python us_superstocks.py --weekly-scan --resume
      - name: Commit seed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/us_superstocks.json docs/api/us_superstocks.json
          if git diff --staged --quiet; then
            echo "No Superstocks seed changes"
            exit 0
          fi
          git commit -m "chore: weekly Superstocks seed $(date '+%Y-%m-%d %H:%M %Z')"
          git push
